name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        repository: danielga/garrysmod_common
        # Pinned instead of tracking master, so a change upstream can't silently
        # break or alter the binaries this repo produces.
        ref: f77a18d86f780a59ea30e4237016b05b790d4b70
        path: 'garrysmod_common'
    - name: Install dependencies
      run: |
        wget https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-linux.tar.gz -O premake.tar.gz
        tar -xf premake.tar.gz
        chmod +x premake5
        sudo cp premake5 /usr/bin
        sudo apt-get update
        sudo apt-get install -y g++-multilib
        gcc --version
    - name: Test
      run: GMCOMMON=garrysmod_common ./test/run.sh
    - name: Generate Project
      run: premake5 --gmcommon=garrysmod_common gmake
    - name: Build
      run: |
        cd projects/linux/gmake
        make config=release_x86
    - name: Verify runtime dependencies
      run: |
        so=projects/linux/gmake/x86/Release/gmsv_eightbit_linux.dll
        readelf -d "$so" | grep NEEDED
        if readelf -d "$so" | grep -q 'NEEDED.*libstdc++'; then
          echo "libstdc++ is linked dynamically - srcds ships an older one and dlopen will fail" >&2
          exit 1
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: gmsv_eightbit_linux.dll
        path: projects/linux/gmake/x86/Release/gmsv_eightbit_linux.dll
        if-no-files-found: error
